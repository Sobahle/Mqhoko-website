<!DOCTYPE html>
<Html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Submit User Info</title>
</head>
<body>
<h1>Submit Your Info</h1>

<form action="/submit" method="post" th:object="${user}">
    <div>
        <label>Full Name:</label>
        <input type="text" th:field="*{fullName}" />
        <p th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></p>
    </div>

    <div>
        <label>Email:</label>
        <input type="email" th:field="*{email}" />
        <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
    </div>

    <div>
        <label>Age:</label>
        <input type="number" th:field="*{age}" />
        <p th:if="${#fields.hasErrors('age')}" th:errors="*{age}"></p>
    </div>

    <button type="submit">Submit</button>
</form>

<h2>All Users:</h2>
<ul>
    <li th:each="user : ${usernames}">
        <span th:text="${user.fullName} + ' (' + ${user.email} + ', ' + ${user.age} + ')'"></span>
    </li>
</ul>
</body>
</Html>
